name: reportaai_cm
description: "App do cidadão do ReportaAi Cm"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

# Todas as dependências usam versão exata, como no backend. A versão do Flutter fica no .fvmrc.
dependencies:
  dio: 5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.1.0
  intl: 0.20.3
  # O Material desacoplado do Flutter, o mesmo que o go_router usa. Substitui o
  # package:flutter/material.dart (ver docs/ARCHITECTURE.md).
  material_ui: 1.7.0
  # Anotações em Dart puro (ex.: @immutable), que o domínio pode usar sem importar o Flutter.
  meta: 1.18.3
  # Sessão do SuperTokens (ver docs/sprints/sprint-3-login.md). Só o lib/core/auth/ importa.
  supertokens_flutter: 0.6.5

dev_dependencies:
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8
  flutter_test:
    sdk: flutter
  # As mesmas versões que o supertokens_flutter usa: os testes do core/auth trocam a rede do SDK
  # (pacote http) e o armazenamento dos tokens (SharedPreferences) por versões em memória.
  http: 1.6.0
  integration_test:
    sdk: flutter
  mocktail: 1.0.5
  shared_preferences: 2.5.6
  very_good_analysis: 11.0.0

flutter:
  uses-material-design: true
