# Splash do app: o pino do ícone sobre o laranja do logo, o mesmo fundo do ícone adaptativo. O
# laranja é só do logo, e não do tema, que usa as cores da UTFPR (lib/app/theme/app_colors.dart).
# Para trocar, substitua as imagens de assets/branding/ e rode:
# fvm dart run flutter_native_splash:create
flutter_native_splash:
  color: '#E65100'
  image: assets/branding/icon_foreground.png
  # O Android 12+ tem o próprio splash: o ícone num círculo, sobre a cor.
  android_12:
    color: '#E65100'
    image: assets/branding/icon_foreground.png
  web: false
